[project]
name = "location-service"
version = "0.1.0"
description = "Track driver locations and find drivers near a pickup point"
readme = "README.md"
authors = [
    { name = "areebh26", email = "areebulhaq2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "redis>=6,<8",
    "uvicorn>=0.34,<1",
]

[project.scripts]
location-service = "location_service:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
